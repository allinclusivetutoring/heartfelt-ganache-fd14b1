[build]
  functions = "netlify/functions"
  publish = "."

# NOTE: the previous [[redirects]] block was removed.
# It mapped /.netlify/functions/* to itself, which is a no-op, and Netlify
# rejects "/.netlify" as a redirect source. Functions are served at that
# path automatically — no redirect rule is needed.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
