[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  # Functions are pre-bundled (dependencies inlined via esbuild),
  # so no npm install / build step is required for a manual deploy.
  node_bundler = "none"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
