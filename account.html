<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="author" content="Laura M. Amato Yarbrough" />
<meta name="copyright" content="© 2025–2026 Laura M. Amato Yarbrough. All rights reserved." />
<link rel="license" href="https://allinclusivetutoring.com/intellectual-property" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Client Portal | All Inclusive Tutoring Solutions LLC</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --navy:#0d2340; --gold:#e8a020; --gold-light:#f5c96a; --teal:#1d9e75; --warm-white:#fffef9; --soft-gray:#f6f5f0; --text-dark:#1a1a2e; --text-mid:#4a4a6a; }
  body { font-family:'DM Sans', sans-serif; color:var(--text-dark); background:var(--soft-gray); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:2rem 1rem; }
  .card { background:#fff; border-radius:16px; padding:2.5rem; max-width:420px; width:100%; box-shadow:0 8px 30px rgba(13,35,64,0.08); }
  .logo { text-align:center; font-family:'Playfair Display', serif; color:var(--navy); font-size:1.2rem; margin-bottom:0.3rem; }
  .logo span { color:var(--gold); }
  .subtitle { text-align:center; color:var(--text-mid); font-size:0.88rem; margin-bottom:1.75rem; }
  .tabs { display:flex; background:var(--soft-gray); border-radius:100px; padding:4px; margin-bottom:1.75rem; }
  .tab { flex:1; text-align:center; padding:10px; border-radius:100px; font-size:0.88rem; font-weight:600; cursor:pointer; color:var(--text-mid); }
  .tab.active { background:var(--navy); color:#fff; }
  .form-group { margin-bottom:1rem; }
  label { display:block; font-size:0.82rem; font-weight:600; color:var(--navy); margin-bottom:0.35rem; }
  input { width:100%; padding:11px 14px; border:1.5px solid #e2ddd0; border-radius:10px; font-size:0.95rem; font-family:inherit; }
  input:focus { outline:none; border-color:var(--teal); }
  .btn { width:100%; padding:13px; border:none; border-radius:100px; background:var(--gold); color:#1a1a2e; font-weight:700; font-size:0.95rem; cursor:pointer; margin-top:0.5rem; }
  .btn:hover { background:var(--gold-light); }
  .btn:disabled { opacity:0.6; cursor:not-allowed; }
  .msg { margin-top:1rem; padding:0.75rem 1rem; border-radius:10px; font-size:0.85rem; display:none; }
  .msg.error { background:#fde8e8; color:#c0392b; }
  .msg.success { background:#e1f5ee; color:#1d9e75; }
  .panel { display:none; }
  .panel.active { display:block; }
  .back { display:block; text-align:center; margin-top:1.5rem; font-size:0.85rem; color:var(--text-mid); text-decoration:none; }
</style>

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "EducationalOrganization",
  "name": "All Inclusive Tutoring LLC",
  "url": "https://allinclusivetutoring.com/",
  "description": "Expert tutoring services for special education, ESA programs, and advanced STEM.",
  "contactPoint": {
    "@type": "ContactPoint",
    "telephone": "659-225-0660",
    "contactType": "Customer Support"
  }
}
</script>

</head>
<body>

<div class="card">
  <div class="logo">All Inclusive Tutoring <span>Solutions LLC</span></div>

  <div class="tabs">
    <div class="tab active" id="tabLogin" onclick="showPanel('login')">Log In</div>
    <div class="tab" id="tabRegister" onclick="showPanel('register')">Register</div>
  </div>

  <div class="panel active" id="loginPanel">
    <form id="loginForm">
      <div class="form-group"><label>Email</label><input type="email" id="loginEmail" required /></div>
      <div class="form-group"><label>Password</label><input type="password" id="loginPassword" required /></div>
      <button type="submit" class="btn" id="loginBtn">Log In →</button>
    </form>
  </div>

  <div class="panel" id="registerPanel">
    <form id="registerForm">
      <div class="form-group"><label>Your Name</label><input type="text" id="regName" required /></div>
      <div class="form-group"><label>Email</label><input type="email" id="regEmail" required /></div>
      <div class="form-group"><label>Password</label><input type="password" id="regPassword" minlength="6" required /></div>
      <button type="submit" class="btn" id="registerBtn">Create Account →</button>
    </form>
  </div>

  <div class="msg" id="msgBox"></div>

  <a href="/" class="back">← Back to homepage</a>
</div>

<script>
  const SUPABASE_URL = "https://hzmxktlkrkohxokzdsvw.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh6bXhrdGxrcmtvaHhva3pkc3Z3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxMTMzOTgsImV4cCI6MjEwMDY4OTM5OH0.CnW4a62P5VQgX9kFizMKvtW0NQzdGsnITsEimiFevHs";
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function showPanel(which) {
    document.getElementById('loginPanel').classList.toggle('active', which === 'login');
    document.getElementById('registerPanel').classList.toggle('active', which === 'register');
    document.getElementById('tabLogin').classList.toggle('active', which === 'login');
    document.getElementById('tabRegister').classList.toggle('active', which === 'register');
    hideMsg();
  }

  function showMsg(text, type) {
    const box = document.getElementById('msgBox');
    box.textContent = text;
    box.className = 'msg ' + type;
    box.style.display = 'block';
  }
  function hideMsg() {
    document.getElementById('msgBox').style.display = 'none';
  }

  // Redirect to dashboard if already logged in
  (async () => {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) window.location.href = '/dashboard.html';
  })();

  document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('registerBtn');
    btn.disabled = true; btn.textContent = 'Creating account...';

    const name = document.getElementById('regName').value;
    const email = document.getElementById('regEmail').value;
    const password = document.getElementById('regPassword').value;

    const { data, error } = await supabaseClient.auth.signUp({
      email,
      password,
      options: { emailRedirectTo: 'https://allinclusivetutoring.com/dashboard.html' }
    });

    if (error) {
      showMsg(error.message, 'error');
      btn.disabled = false; btn.textContent = 'Create Account →';
      return;
    }

    if (data.user) {
      const { error: profileError } = await supabaseClient.from('profiles').insert({
        id: data.user.id,
        parent_name: name,
        parent_email: email
      });
      if (profileError) {
        showMsg('Account created, but profile setup failed: ' + profileError.message, 'error');
        btn.disabled = false; btn.textContent = 'Create Account →';
        return;
      }
    }

    showMsg('Account created! Redirecting...', 'success');
    setTimeout(() => { window.location.href = '/dashboard.html'; }, 1200);
  });

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    btn.disabled = true; btn.textContent = 'Logging in...';

    const email = document.getElementById('loginEmail').value;
    const password = document.getElementById('loginPassword').value;

    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

    if (error) {
      showMsg(error.message, 'error');
      btn.disabled = false; btn.textContent = 'Log In →';
      return;
    }

    window.location.href = '/dashboard.html';
  });
</script>

</body>
</html>
